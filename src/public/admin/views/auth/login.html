<html>

<head>
  <meta charset="utf-8" />

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <link rel="icon" href="../../admin/assets/img/adminlogo.jpg" type="image" />
  <link href="../../admin/assets/css/bootstrap.min.css" rel="stylesheet" />
  <link href="../../admin/assets/font-awesome/css/font-awesome.css" rel="stylesheet" />
  <link href="../../admin/assets/css/animate.css" rel="stylesheet" />
  <link href="../../admin/assets/css/style.css" rel="stylesheet" />

  <!-- <link href="../../admin/assets/css/style.css" rel="stylesheet"> -->

</head>

<!-- <body onload="mainFunction()" style="
      background-image: url('../../admin/assets/img/loginimage.png');
      background-size: cover;
    "> -->

<body>
  <div class="d-flex vh-100 justify-content-center align-items-center bg-white">
    <div class="wrapper wrapper-content animated fadeInRight login">
      <!-- <div class="ibox-title d-flex align-items-center justify-content-between bg_logo_login"> -->
      <div style="text-align: center; background-color: #462085; padding: 20px;">

        <!-- <h3 class="w-100 d-flex justify-content-center align-items-center"> -->
        <img src="../../admin/assets/img/Icon-App-83.5x83.5@2x.png" alt="Logo" class="logo" />
        <!-- </h3> -->
      </div>
      <form style="border: 2px solid #462085; padding: 20px; height: 300px; display: flex;" method="post" id="login_12l"
        enctype="multipart/form-data" class="maxwidth" role="form">
        <div class="row" style="margin: auto;">
          <div class="col-12 col-sm-12 form-group">
            <div class="">
              <input type="text" class="form-control" id="email" name="email" style="padding: 26px 12px;"
                placeholder="Enter Email" required />
            </div>
          </div>
          <div class="col-12 col-sm-12 form-group">
            <div class="">
              <input type="text" class="form-control" id="password" name="password" style="padding: 26px 12px;"
                placeholder="Password" required />
            </div>
          </div>
          <div class="col-12 col-sm-12 col-md-12 col-lg-12 form-group">
            <div class="">
              <button id="addButton" style="
                    background-color: #462085;
                    border-color: #462085;
                    width: 100%; padding: 14px 12px;" type="button" class="btn btn-success btn-lg" onclick="login()">
                Log In
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
  <!-- Mainly scripts -->
  <script src="../../admin/assets/js/jquery-3.1.1.min.js"></script>
  <script src="../../admin/assets/js/popper.min.js"></script>
  <script src="../../admin/assets/js/bootstrap.js"></script>

  <script>
    var host = window.location.protocol + "//" + window.location.host;

    var token = sessionStorage.getItem("token");
    if (token) {
      window.location.replace("/admin/dashboard");
    }


    //******Search value by Enter**************/
    $("#password").keyup(function (event) {
      if (event.keyCode === 13) {
        $("#btnId").click();
      }
    });
    $("input").keypress(function (e) {
      if (e.which === 32) return false;
    });
    // Get the button element

    document.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        if (
          document.getElementById("email").value &&
          document.getElementById("password").value
        ) {
          document.getElementById("addButton").click();
        }
      }
    });
  </script>
  <script src="../../admin/scripts/auth/login.js"></script>
</body>

</html>
