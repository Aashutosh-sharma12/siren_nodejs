<!DOCTYPE html>
<html>

<head>


    <meta charset="utf-8">

    <title>Admin | RO_Kart</title>

    <link rel="icon" href="../../admin/assets/img/menu_logo.svg" type="image">
    <link href="../../admin/assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="../../admin/assets/css/style.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <link href="../../admin//assets/css/plugins/sweetalert/sweetalert.css" rel="stylesheet">

    <!-- js files -->
    <script src="../../admin/scripts/auth/logout.js"></script>
    <script src="../../admin/scripts/dashboard.js"></script>
    <script src="../../admin/scripts/edit/editBanner.js"></script>
    <script src="../../admin/scripts/helper/button.js"></script>
    <script src="../../admin/scripts/common/pipeline.js"></script>
    <script src="../../admin/scripts/common/validation.js"></script>

<script src="https://www.gstatic.com/firebasejs/7.18.0/firebase-messaging.js"></script> -->

    <style type="text/css">
        .container {
            margin: 100px auto;
        }

        input.storeImage_file {
            width: 150px !important;
            height: 150px !important;
            cursor: pointer;
        }

        .innerSec {
            border: 1px solid #1AB394;
            padding: 10px;
        }

        c input.storeImage_file {
            position: absolute;
            top: 35px;
            height: 130px;
            width: 140px;
            left: 15px;
            opacity: 0;
            z-index: -1;
            cursor: pointer;
        }

        input,
        select {
            height: 50px !important;
        }

        .addVendor_cancel {
            border: 1px solid #1AB394;
            color: #1AB394;

        }

        .addVendor_cancel:hover {
            border: 1px solid #1AB394;
            color: #1AB394;

        }

        @media only screen and (max-width: 992px) {
            .lastline {
                margin: 0px !important;
                width: 100% !important;
                display: inline-block !important;
            }
        }
    </style>
</head>

<body onload="checkToken();bannerDetails();">
    <div id="wrapper">
        <navbar></navbar>
        <div id="page-wrapper" class="gray-bg">
            <div class="border-bottom row">
                <nav class="navbar navbar-static-top" role="navigation" style="margin-bottom: 0">
                    <div class="navbar-header">
                        <a class="navbar-minimalize minimalize-styl-2 menuBtn" href="#"><i class="fa fa-bars"></i>
                        </a>
                        <form role="search" class="navbar-form-custom" action="search_results.html">
                        </form>
                    </div>
                    <ul class="nav navbar-top-links navbar-right">
                        <li>
                            <span class="m-r-sm text-muted welcome-message">Welcome to RO_Kart Admin</span>
                        </li>

                        <li><a class="dropdown-item" onclick="logout()">Logout <img
                                    src="../../../admin/assets/img/logout .png"></a></li>
                    </ul>

                </nav>
            </div>
            <div class="row wrapper border-bottom white-bg page-heading">
                <div class="col-lg-10">
                    <h2><strong>Edit Banner</strong></h2>
                </div>
            </div>
            <div class="wrapper wrapper-content animated fadeInRight">

                <form id="form" method="post" enctype="multipart/form-data" class="maxwidth" role="form">
                    <span>
                        <h2 style="font-weight:bold;">Please Update the Banner Details</h2>
                    </span>
                    <div class="shadow-lg py-4 px-4 mt-3 bg-white rounded_md">
                        <div class="row">
                            <div class="col-12 col-sm-6 col-md-6 col-lg-6">
                                <div class="form-group">
                                    <h4>Title
                                    </h4>
                                    <input type="text" oninput="validate(this);validateInput(this);"
                                        class="form-control" id="title" name="title" placeholder=" Enter Title"
                                        >
                                    <!-- <input type="text" 
                                        class="form-control" id="imageUrl"
                                         style="display: none;"> -->
                                </div>
                            </div>
                            <div class="col-12 col-sm-6 col-md-6 col-lg-6">
                                <div class="form-group">
                                    <h4>Type<span style="color: red;">*</span></h4>
                                    <select class="form-control" id="type"
                                        name="type" onchange="checkType(this)" placeholder=" Enter Type" required>
                                        <option value="" disabled selected>Select Type</option>
                                        <option value="Normal">Normal</option>
                                        <option value="Book">Book</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <!-- <div class="col-12 col-sm-6 col-md-6 col-lg-6">
                                <div class="form-group">
                                    <h4>Amount
                                    </h4>
                                    <input type="text" oninput="validateNumber(event)" class="form-control" id="amount1"
                                     placeholder=" Enter Amount" >
                                </div>
                            </div> -->
                            <div class="col-12 col-sm-6 col-md-6 col-lg-6">
                                <div class="form-group">
                                    <h4>Position<span style="color: red;">*</span></h4>
                                    <input type="number" oninput="validate(this)" class="form-control" id="position"
                                        name="position" placeholder=" Enter position" min="1" required>
                                        <input type="text" id="bannerId" name="bannerId" style="display: none;">

                                    </div>
                            </div>
                        </div>
                        <!-- <div class="row" style="display: none;" id="banner">
                            <div class="col-12 col-sm-12 col-md-12 col-lg-12">
                                <div class="form-group">
                                    <h4>Banner Url
                                    </h4>
                                    <input type="text" oninput="validate(this);validateInput(this);"
                                        class="form-control" id="bannerUrl" name="bannerUrl"
                                        placeholder=" Enter Banner Url">
                                </div>
                            </div>
                        </div> -->
                        <div class="row">
                            <div class="col-12 col-sm-12 col-md-12 col-lg-12">
                                <div class="form-group">
                                    <h4>Description
                                    </h4>
                                    <input type="text" oninput="validate(this);validateInput(this);"
                                        class="form-control" id="description" name="description"
                                        placeholder=" Enter Description">
                                </div>
                            </div>
                        </div>
                            <div>
                                <h4>Banner Image(/.jpg/.png/.jpeg)<span style="color: red;">*</span></h4>
                                <div class="form-group">
                                    <label id="image" style="cursor: pointer;"> <img id="blah"
                                            src="../../admin/assets/img/banner_image.svg" alt=""
                                            style="width:200px; height:200px;" class="rounded_md"><br>
                                        <input type="file" name="image" id="imageInput" accept="image/*"
                                            onchange="readURL(this)" class="mt-3" />
                                        <h3>Image size: 200×200</h3>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end">
                                <button style="width: 250px;color: white;" id="button"
                                    class="btn btn-orange btn-lg ">Submit</button>
                            </div>
                    </div>
                </form>
            </div>
            <footer class="mt-4"></footer>
        </div>
    </div>
    <!-- Mainly scripts -->
    <script src="../../admin/assets/js/jquery-3.1.1.min.js"></script>
    <script src="../../admin/assets/js/bootstrap.js"></script>
    <script src="assets/js/plugins/sweetalert/sweetalert.min.js"></script>

    <script>
        var token = sessionStorage.getItem("token");
        var host = window.location.protocol + "//" + window.location.host;
        if (!token) {
          sessionStorage.removeItem("token");
            window.location.replace('/admin/login');
        }

    </script>
</body>

</html>
