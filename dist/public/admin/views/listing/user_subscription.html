                    <div class="modal-body">
                        <div class="row">
                            <div class="col-lg-8 col-md-7 col-12">
                                <div class="form-group">
                                    <label>Title</label>
                                    <input type="text" class="form-control" id="name" name='name'
                                        placeholder="Enter Name" maxlength="30">
                                    <h6 style="text-align: right;">30 Characters Max</h6>
                                </div>
                                <div class="form-group">
                                    <label>Subscription Type</label>
                                    <select class="form-control" id="sub_type" name="sub_type1">
                                        <option value='monthly'>Monthly</option>
                                        <option value='6-months'>6-Months</option>
                                        <option value='yearly'>Yearly</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label>Subscription Amount</label>
                                    <input type="text" class="form-control" id="amount1" name='amount1'

                                </div>
                                <!-- REPLACED FEATURES INPUT -->
                                <div class="form-group">
                                    <label>Features</label>
                                    <div class="task-input-wrapper" style="display:flex; gap:10px;">
                                        <input type="text" id="featureInput" class="form-control"
                                            placeholder="Enter feature" maxlength="50">
                                        <button type="button" class="btn btn-primary" id="addFeatureBtn">+ Add</button>
                                    </div>
                                    <div id="featureList" style="margin-top:10px;"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                        <button type="button" class="btn btn-white" data-dismiss="modal">Cancel</button>
                        <button type="button" class="btn btn-white">Submit</button>
                    </div>
                </div>
            </div>
        </form>

    <!-- Peity -->
    <script type="text/javascript" src="../../admin/assets/paginate/pagination.min.js"></script>
    <script src="assets/js/plugins/sweetalert/sweetalert.min.js"></script>

    <script>
        var token = sessionStorage.getItem("token");
        var host = window.location.protocol + "//" + window.location.host;
        if (!token) {
            sessionStorage.removeItem("token");
            window.location.replace("/admin/login");
        }
        document.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                if (document.getElementById("fog").value) {
                    document.getElementById("btnId").click();
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const featureInput = document.getElementById('featureInput');
            const addFeatureBtn = document.getElementById('addFeatureBtn');
            const featureList = document.getElementById('featureList');
            let featureCount = 0;

            function createFeatureItem(text) {
                featureCount++;
                const div = document.createElement('div');
                div.className = 'task-item';
                div.style.display = 'flex';
                div.style.alignItems = 'center';
                div.style.justifyContent = 'space-between';
                div.style.border = '1px solid #eee';
                div.style.borderRadius = '6px';
                div.style.padding = '8px 12px';
                div.style.marginTop = '5px';
                div.style.background = '#fff';

                const span = document.createElement('span');
                span.textContent = `${featureCount}. ${text}`;
                span.contentEditable = true;
                span.style.flex = '1';

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'btn btn-sm btn-danger';
                removeBtn.innerHTML = '🗑';
                removeBtn.onclick = () => {
                    div.remove();
                    reorderFeatures();
                };

                div.appendChild(span);
                div.appendChild(removeBtn);
                return div;
            }

            function reorderFeatures() {
                const items = featureList.querySelectorAll('.task-item span');
                featureCount = 0;
                items.forEach((span) => {
                    featureCount++;
                    const text = span.textContent.split('. ').slice(1).join('. ');
                    span.textContent = `${featureCount}. ${text}`;
                });
            }

            addFeatureBtn.addEventListener('click', () => {
                const text = featureInput.value.trim();
                if (text) {
                    featureList.appendChild(createFeatureItem(text));
                    featureInput.value = '';
                    featureInput.focus();
                }
            });

            document.getElementById('form').addEventListener('submit', (e) => {
                e.preventDefault();
                const features = [];
                featureList.querySelectorAll('.task-item span').forEach(span => {
                    features.push(span.textContent.split('. ').slice(1).join('. '));
                });
                console.log('Submitted Features:', features);
            });
        });
    </script>
